<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>mqlam</title>

    <style>

        /* =========================
           GENERAL PAGE
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;

            background: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================
           MAIN LOGO
        ========================= */

        .scene {
            perspective: 900px;
        }

        .logo {
            position: relative;

            display: inline-block;

            font-size: clamp(80px, 14vw, 220px);
            font-weight: 900;
            letter-spacing: -0.08em;
            line-height: 1;

            color: white;

            -webkit-text-stroke: 5px black;

            transform-style: preserve-3d;

            cursor: pointer;

            transition: transform 0.15s ease-out;

            paint-order: stroke fill;
        }


        /* =========================
           COMIC SPIKED OUTLINE
        ========================= */

        .logo::before {
            content: "";

            position: absolute;

            z-index: -1;

            left: -7%;
            top: -15%;

            width: 114%;
            height: 130%;

            background: black;

            clip-path: polygon(
                0% 38%,
                7% 35%,
                2% 24%,
                13% 27%,
                10% 14%,
                22% 20%,
                20% 7%,
                31% 16%,
                34% 2%,
                42% 14%,
                50% 0%,
                56% 14%,
                67% 4%,
                67% 17%,
                80% 9%,
                77% 22%,
                92% 18%,
                86% 31%,
                100% 30%,
                91% 40%,
                100% 50%,
                91% 57%,
                99% 68%,
                86% 67%,
                91% 81%,
                78% 76%,
                80% 91%,
                67% 83%,
                64% 100%,
                54% 87%,
                45% 98%,
                40% 85%,
                28% 95%,
                30% 81%,
                17% 88%,
                20% 74%,
                6% 77%,
                12% 64%,
                0% 62%,
                9% 51%
            );

            transform: translateZ(-10px);
        }


        /* =========================
           COMIC WHITE OFFSET
        ========================= */

        .logo::after {
            content: "mqlam";

            position: absolute;

            inset: 0;

            color: transparent;

            -webkit-text-stroke: 3px white;

            transform:
                translate(5px, 5px)
                translateZ(-5px);

            z-index: -1;
        }


        /* =========================
           IMAGE CONTAINER
        ========================= */

        .image-container {
            position: fixed;

            left: 30px;
            bottom: 30px;

            width: 500px;
            height: 300px;

            pointer-events: none;
        }


        /* =========================
           IMAGE
        ========================= */

        .photo {
            position: absolute;

            left: 0;
            bottom: 0;

            width: 200px;
            height: auto;

            z-index: 2;

            object-fit: cover;
        }


        /* =========================
           WAVY LINES
        ========================= */

        .wavy-lines {
            position: absolute;

            left: 0;
            bottom: 0;

            width: 500px;
            height: 300px;

            z-index: 1;

            fill: none;

            stroke: black;

            stroke-width: 3;

            stroke-linecap: round;

            stroke-linejoin: round;
        }

    </style>
</head>


<body>


    <!-- =========================
         CENTER LOGO
    ========================= -->

    <div class="scene">

        <div class="logo" id="logo">
            mqlam
        </div>

    </div>



    <!-- =========================
         BOTTOM LEFT IMAGE + LINES
    ========================= -->

    <div class="image-container">


        <!-- WAVY LINES -->

        <svg
            class="wavy-lines"
            viewBox="0 0 500 300"
            preserveAspectRatio="none"
        >

            <path
                d="M80 220
                   C150 180, 130 100, 230 80
                   S350 80, 470 20"
            />

            <path
                d="M80 230
                   C160 200, 150 130, 250 110
                   S370 100, 480 60"
            />

            <path
                d="M80 240
                   C160 220, 180 170, 270 150
                   S380 150, 480 110"
            />

            <path
                d="M80 250
                   C170 250, 190 210, 280 190
                   S390 190, 480 160"
            />

        </svg>


        <!-- YOUR IMAGE -->

        <img
            src="images/photo1.jpg"
            class="photo"
            alt="Photo"
        >

    </div>



    <!-- =========================
         3D LOGO HOVER
    ========================= -->

    <script>

        const logo = document.getElementById("logo");


        logo.addEventListener("mousemove", (event) => {

            const rect = logo.getBoundingClientRect();


            // Find mouse position relative
            // to the center of the logo

            const x =
                event.clientX -
                (rect.left + rect.width / 2);

            const y =
                event.clientY -
                (rect.top + rect.height / 2);


            // Convert mouse position
            // into rotation

            const rotateY =
                (x / rect.width) * 25;

            const rotateX =
                -(y / rect.height) * 25;


            // Apply 3D rotation

            logo.style.transform = `
                rotateX(${rotateX}deg)
                rotateY(${rotateY}deg)
                scale(1.04)
            `;

        });


        // Return logo to normal
        // when mouse leaves

        logo.addEventListener("mouseleave", () => {

            logo.style.transform = `
                rotateX(0deg)
                rotateY(0deg)
                scale(1)
            `;

        });

    </script>


</body>
</html>
