<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Computer Startup</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* STARTUP SCREEN */
        #startup {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .logo {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .loading-container {
            width: 250px;
            height: 6px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
        }

        .loading-bar {
            width: 0%;
            height: 100%;
            background: white;
            animation: loading 4s linear forwards;
        }

        .loading-text {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }

        @keyframes loading {
            from {
                width: 0%;
            }

            to {
                width: 100%;
            }
        }

        /* DESKTOP */
        #desktop {
            display: none;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #182848, #4b6cb7);
        }

        .desktop-text {
            position: absolute;
            top: 30px;
            left: 30px;
            font-size: 28px;
        }

        .taskbar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 55px;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .start-button {
            background: #222;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .start-button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <!-- STARTUP -->
    <div id="startup">

        <div class="logo">
            NOVA
        </div>

        <div class="loading-container">
            <div class="loading-bar"></div>
        </div>

        <div class="loading-text">
            Starting system...
        </div>

    </div>


    <!-- DESKTOP -->
    <div id="desktop">

        <div class="desktop-text">
            Welcome
        </div>

        <div class="taskbar">
            <div class="start-button">
                ◉ Start
            </div>
        </div>

    </div>


    <script>

        // Wait for the startup animation to finish
        setTimeout(() => {

            document.getElementById("startup").style.display = "none";
            document.getElementById("desktop").style.display = "block";

        }, 4500);

    </script>

</body>
</html>
