<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mqlam</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .scene {
            perspective: 900px;
        }

        .logo {
            position: relative;
            display: inline-block;

            font-size: clamp(80px, 14vw, 220px);
            font-weight: 900;
            letter-spacing: -0.08em;
            line-height: 1;

            color: white;

            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;

            cursor: pointer;

            /* Comic-style black outline */
            -webkit-text-stroke: 5px black;

            /* Makes the text feel heavier */
            paint-order: stroke fill;
        }

        /*
            Spiked comic outline
            --------------------
            The pseudo-element creates a jagged shape
            behind the text using a clip-path.
        */
        .logo::before {
            content: "";
            position: absolute;

            z-index: -1;

            left: -7%;
            top: -15%;
            width: 114%;
            height: 130%;

            background: black;

            clip-path: polygon(
                0% 38%,
                7% 35%,
                2% 24%,
                13% 27%,
                10% 14%,
                22% 20%,
                20% 7%,
                31% 16%,
                34% 2%,
                42% 14%,
                50% 0%,
                56% 14%,
                67% 4%,
                67% 17%,
                80% 9%,
                77% 22%,
                92% 18%,
                86% 31%,
                100% 30%,
                91% 40%,
                100% 50%,
                91% 57%,
                99% 68%,
                86% 67%,
                91% 81%,
                78% 76%,
                80% 91%,
                67% 83%,
                64% 100%,
                54% 87%,
                45% 98%,
                40% 85%,
                28% 95%,
                30% 81%,
                17% 88%,
                20% 74%,
                6% 77%,
                12% 64%,
                0% 62%,
                9% 51%
            );

            transform: translateZ(-10px);
        }

        /* Small offset shadow for a comic-print feel */
        .logo::after {
            content: "mqlam";

            position: absolute;
            inset: 0;

            color: transparent;
            -webkit-text-stroke: 3px white;

            transform: translate(5px, 5px) translateZ(-5px);

            z-index: -1;
        }

        .logo:hover {
            transition: transform 0.05s ease-out;
        }

        .photo {
            position: fixed;
            left: 30px;
            bottom: 30px;
            width: 250px;

            transform: rotate(-5deg);
            box-shadow: 8px 8px 0 black;
        }

    </style>
</head>

<body>

    <div class="scene">
        <div class="logo" id="logo">mqlam</div>
    </div>

    <img src="images/piano.jpg" class="photo">

    <script>
        const logo = document.getElementById("logo");

        logo.addEventListener("mousemove", (event) => {
            const rect = logo.getBoundingClientRect();

            // Mouse position relative to the center
            const x = event.clientX - (rect.left + rect.width / 2);
            const y = event.clientY - (rect.top + rect.height / 2);

            // Convert position into rotation
            const rotateY = (x / rect.width) * 25;
            const rotateX = -(y / rect.height) * 25;

            logo.style.transform = `
                rotateX(${rotateX}deg)
                rotateY(${rotateY}deg)
                scale(1.04)
            `;
        });

        logo.addEventListener("mouseleave", () => {
            logo.style.transform = `
                rotateX(0deg)
                rotateY(0deg)
                scale(1)
            `;
        });
    </script>

</body>
</html>
