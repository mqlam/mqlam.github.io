
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mqlam — Portfolio</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: white;
            color: black;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        /* HERO */

        .hero {
            height: 100vh;
            min-height: 600px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .cd {
            position: absolute;
            width: min(75vw, 650px);
            height: auto;
            z-index: 1;
            pointer-events: none;
            will-change: transform;
        }

        .logo {
            position: relative;
            z-index: 2;
            font-size: clamp(75px, 15vw, 190px);
            font-weight: 900;
            letter-spacing: -12px;
            transform-style: preserve-3d;
            transition: transform 0.12s ease-out;
            will-change: transform;
            cursor: default;
            user-select: none;
        }

        .logo::before {
            content: "";
            position: absolute;
            inset: -15px -25px;
            background: white;
            z-index: -1;
            clip-path: polygon(
                50% 0%, 57% 12%, 69% 3%, 73% 17%,
                88% 11%, 86% 27%, 100% 35%, 88% 47%,
                98% 60%, 83% 66%, 91% 83%, 73% 82%,
                66% 100%, 53% 88%, 41% 100%, 34% 84%,
                16% 91%, 19% 73%, 0% 66%, 13% 52%,
                0% 39%, 16% 31%, 10% 14%, 30% 18%,
                37% 2%
            );
        }

        .instagram {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            font-size: 25px;
            color: black;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .instagram:hover {
            transform: translateX(-50%) scale(1.15);
        }

        .scroll-prompt {
            position: absolute;
            bottom: 45px;
            right: 45px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: opacity 0.3s ease;
        }

        .scroll-prompt.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* WORK SECTION */

        .work {
            width: 100%;
            padding: 100px 5%;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid black;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .section-heading h2 {
            font-size: clamp(35px, 6vw, 70px);
            font-weight: 900;
            letter-spacing: -3px;
            text-transform: uppercase;
        }

        .section-heading span {
            font-size: 12px;
            letter-spacing: 2px;
        }

        /* PHOTOGRAPHY NAVIGATION */

        .photo-navigation {
            display: flex;
            gap: 10px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .photo-tab {
            padding: 12px 27px;
            background: white;
            color: black;
            border: 1px solid black;
            font-family: inherit;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .photo-tab:hover {
            background: #eaeaea;
        }

        .photo-tab.active {
            background: black;
            color: white;
        }

        .photo-tab.active:hover {
            background: #333;
        }

        /* COLLECTION PAGES */

        .photo-page {
            display: none;
            animation: pageFade 0.3s ease;
        }

        .photo-page.active {
            display: block;
        }

        @keyframes pageFade {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .collection-title {
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* PHOTO GRID */

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 15px;
            align-items: start;
        }

        .photo-item {
            width: 100%;
            overflow: hidden;
            background: #f2f2f2;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            aspect-ratio: 1 / 1;
            display: block;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .photo-item:hover img {
            transform: scale(1.04);
        }

        /* VIDEOGRAPHY */

        .video-section {
            margin-top: 130px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .video-card {
            position: relative;
            background: #111;
            overflow: hidden;
            cursor: pointer;
        }

        .video-card video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            pointer-events: none;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            background: rgba(0, 0, 0, 0.15);
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .video-card:hover .video-overlay {
            opacity: 1;
        }

        .video-overlay i {
            font-size: 45px;
        }

        /* VIDEO MODAL */

        .video-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .video-modal.active {
            display: flex;
        }

        .video-modal video {
            max-width: 100%;
            max-height: 85vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .close-video {
            position: absolute;
            top: 25px;
            right: 35px;
            color: white;
            font-size: 35px;
            cursor: pointer;
            background: none;
            border: none;
        }

        /* CONTACT */

        .contact {
            padding: 120px 8%;
            margin-top: 100px;
            border-top: 1px solid black;
        }

        .contact h2 {
            font-size: clamp(55px, 10vw, 120px);
            font-weight: 900;
            letter-spacing: -7px;
            text-transform: uppercase;
            margin-bottom: 50px;
        }

        .contact-form {
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 15px 0;
            border: none;
            border-bottom: 1px solid black;
            background: transparent;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            resize: vertical;
        }

        .contact-form textarea {
            min-height: 120px;
        }

        .contact-form button {
            width: fit-content;
            padding: 15px 35px;
            background: black;
            color: white;
            border: 1px solid black;
            font-size: 12px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .contact-form button:hover {
            background: white;
            color: black;
        }

        /* FOOTER */

        footer {
            padding: 25px 5%;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid black;
            font-size: 11px;
            letter-spacing: 1px;
        }

        /* MOBILE */

        @media (max-width: 700px) {
            .hero {
                min-height: 500px;
            }

            .logo {
                letter-spacing: -6px;
            }

            .cd {
                width: 90vw;
            }

            .scroll-prompt {
                right: 20px;
                bottom: 85px;
                font-size: 9px;
            }

            .instagram {
                bottom: 35px;
            }

            .work {
                padding: 70px 4%;
            }

            .photo-navigation {
                gap: 7px;
            }

            .photo-tab {
                padding: 11px 17px;
                font-size: 10px;
            }

            .photo-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .video-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .section-heading h2 {
                letter-spacing: -2px;
            }

            .video-section {
                margin-top: 90px;
            }

            .contact {
                padding: 80px 5%;
            }

            .contact h2 {
                letter-spacing: -4px;
            }

            footer {
                gap: 15px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <!-- HERO -->

    <section class="hero">

        <div class="hero-content">

            <img src="images/cd.png" alt="CD" class="cd" id="cd">

            <h1 class="logo" id="logo">mqlam</h1>

        </div>

        <a class="instagram"
           href="https://www.instagram.com/YOUR_USERNAME/"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Instagram">
            <i class="fa-brands fa-instagram"></i>
        </a>

        <div class="scroll-prompt" id="scrollPrompt">
            SCROLL TO EXPLORE ↓
        </div>

    </section>


    <!-- WORK -->

    <main class="work">

        <!-- PHOTOGRAPHY -->

        <section class="photography">

            <div class="section-heading">
                <h2>Photography</h2>
                <span>01 / PHOTO</span>
            </div>


            <!-- COLLECTION BUTTONS -->

            <div class="photo-navigation">

                <button
                    class="photo-tab active"
                    onclick="showCollection('creative', this)">
                    Creative
                </button>

                <button
                    class="photo-tab"
                    onclick="showCollection('client', this)">
                    Client
                </button>

                <button
                    class="photo-tab"
                    onclick="showCollection('awards', this)">
                    Awards
                </button>

            </div>


            <!-- CREATIVE COLLECTION -->
            <!-- This collection is selected by default -->

            <div class="photo-page active" id="creative">

                <div class="collection-title">
                    Creative
                </div>

                <div class="photo-grid">

                    <div class="photo-item">
                        <img src="images/creative1.jpg" alt="Creative photography 1">
                    </div>

                    <div class="photo-item">
                        <img src="images/creative2.jpg" alt="Creative photography 2">
                    </div>

                    <div class="photo-item">
                        <img src="images/creative3.jpg" alt="Creative photography 3">
                    </div>

                    <div class="photo-item">
                        <img src="images/creative4.jpg" alt="Creative photography 4">
                    </div>

                    <div class="photo-item">
                        <img src="images/creative5.jpg" alt="Creative photography 5">
                    </div>

                    <div class="photo-item">
                        <img src="images/creative6.jpg" alt="Creative photography 6">
                    </div>

                </div>

            </div>


            <!-- CLIENT COLLECTION -->

            <div class="photo-page" id="client">

                <div class="collection-title">
                    Client
                </div>

                <div class="photo-grid">

                    <div class="photo-item">
                        <img src="images/client1.jpg" alt="Client photography 1">
                    </div>

                    <div class="photo-item">
                        <img src="images/client2.jpg" alt="Client photography 2">
                    </div>

                    <div class="photo-item">
                        <img src="images/client3.jpg" alt="Client photography 3">
                    </div>

                    <div class="photo-item">
                        <img src="images/client4.jpg" alt="Client photography 4">
                    </div>

                    <div class="photo-item">
                        <img src="images/client5.jpg" alt="Client photography 5">
                    </div>

                    <div class="photo-item">
                        <img src="images/client6.jpg" alt="Client photography 6">
                    </div>

                </div>

            </div>


            <!-- AWARDS COLLECTION -->

            <div class="photo-page" id="awards">

                <div class="collection-title">
                    Awards
                </div>

                <div class="photo-grid">

                    <div class="photo-item">
                        <img src="images/awards1.jpg" alt="Awards photography 1">
                    </div>

                    <div class="photo-item">
                        <img src="images/awards2.jpg" alt="Awards photography 2">
                    </div>

                    <div class="photo-item">
                        <img src="images/awards3.jpg" alt="Awards photography 3">
                    </div>

                    <div class="photo-item">
                        <img src="images/awards4.jpg" alt="Awards photography 4">
                    </div>

                    <div class="photo-item">
                        <img src="images/awards5.jpg" alt="Awards photography 5">
                    </div>

                    <div class="photo-item">
                        <img src="images/awards6.jpg" alt="Awards photography 6">
                    </div>

                </div>

            </div>

        </section>


        <!-- VIDEOGRAPHY -->

        <section class="video-section">

            <div class="section-heading">
                <h2>Videography</h2>
                <span>02 / VIDEO</span>
            </div>

            <div class="video-grid">

                <div class="video-card"
                     onclick="openVideo('videos/video1.mp4')">

                    <video muted preload="metadata">
                        <source src="videos/video1.mp4" type="video/mp4">
                    </video>

                    <div class="video-overlay">
                        <i class="fa-solid fa-play"></i>
                    </div>

                </div>


                <div class="video-card"
                     onclick="openVideo('videos/video2.mp4')">

                    <video muted preload="metadata">
                        <source src="videos/video2.mp4" type="video/mp4">
                    </video>

                    <div class="video-overlay">
                        <i class="fa-solid fa-play"></i>
                    </div>

                </div>


                <div class="video-card"
                     onclick="openVideo('videos/video3.mp4')">

                    <video muted preload="metadata">
                        <source src="videos/video3.mp4" type="video/mp4">
                    </video>

                    <div class="video-overlay">
                        <i class="fa-solid fa-play"></i>
                    </div>

                </div>


                <div class="video-card"
                     onclick="openVideo('videos/video4.mp4')">

                    <video muted preload="metadata">
                        <source src="videos/video4.mp4" type="video/mp4">
                    </video>

                    <div class="video-overlay">
                        <i class="fa-solid fa-play"></i>
                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- VIDEO POPUP -->

    <div class="video-modal" id="videoModal" onclick="closeVideoOutside(event)">

        <button class="close-video"
                onclick="closeVideo()"
                aria-label="Close video">
            &times;
        </button>

        <video id="popupVideo" controls playsinline></video>

    </div>


    <!-- CONTACT -->

    <section class="contact">

        <h2>Let's Talk.</h2>

        <form class="contact-form"
              action="https://formspree.io/f/mwleloew"
              method="POST">

            <input
                type="text"
                name="name"
                placeholder="Your name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Your email"
                required
            >

            <input
                type="text"
                name="subject"
                placeholder="Subject"
            >

            <textarea
                name="message"
                placeholder="Your message"
                required
            ></textarea>

            <button type="submit">SEND MESSAGE ↗</button>

        </form>

    </section>


    <!-- FOOTER -->

    <footer>
        <span>MQLAM © 2026</span>
        <span>PHOTOGRAPHY · DESIGN · VIDEO</span>
    </footer>


    <script>

        /* COLLECTION SWITCHING */

        function showCollection(collection, button) {

            // Hide every collection
            document.querySelectorAll(".photo-page").forEach(page => {
                page.classList.remove("active");
            });

            // Remove active styling from every button
            document.querySelectorAll(".photo-tab").forEach(tab => {
                tab.classList.remove("active");
            });

            // Show selected collection
            document.getElementById(collection).classList.add("active");

            // Highlight selected button
            button.classList.add("active");

        }


        /* CURSOR-FOLLOWING LOGO TILT */

        const logo = document.getElementById("logo");

        let targetX = 0;
        let targetY = 0;

        let currentX = 0;
        let currentY = 0;

        document.addEventListener("mousemove", (event) => {

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            const mouseX = (event.clientX - centerX) / centerX;
            const mouseY = (event.clientY - centerY) / centerY;

            targetX = mouseY * -12;
            targetY = mouseX * 12;

        });

        function animateLogo() {

            currentX += (targetX - currentX) * 0.08;
            currentY += (targetY - currentY) * 0.08;

            logo.style.transform =
                `perspective(800px) rotateX(${currentX}deg) rotateY(${currentY}deg)`;

            requestAnimationFrame(animateLogo);

        }

        animateLogo();


        /* CD ROTATION ON SCROLL */

        const cd = document.getElementById("cd");

        window.addEventListener("scroll", () => {

            const scrollAmount = window.scrollY;

            cd.style.transform = `rotate(${scrollAmount * 0.35}deg)`;

        });


        /* SCROLL PROMPT DISAPPEARS */

        const scrollPrompt = document.getElementById("scrollPrompt");

        window.addEventListener("scroll", () => {

            if (window.scrollY > 50) {
                scrollPrompt.classList.add("hidden");
            } else {
                scrollPrompt.classList.remove("hidden");
            }

        });


        /* VIDEO POPUP */

        const videoModal = document.getElementById("videoModal");
        const popupVideo = document.getElementById("popupVideo");

        function openVideo(videoSource) {

            popupVideo.src = videoSource;
            videoModal.classList.add("active");

            popupVideo.load();

            popupVideo.play().catch(() => {
                // The user can press play if the browser blocks autoplay.
            });

        }

        function closeVideo() {

            popupVideo.pause();
            popupVideo.removeAttribute("src");
            popupVideo.load();

            videoModal.classList.remove("active");

        }

        function closeVideoOutside(event) {

            if (event.target === videoModal) {
                closeVideo();
            }

        }

        document.addEventListener("keydown", (event) => {

            if (event.key === "Escape") {
                closeVideo();
            }

        });

    </script>

</body>
</html>
