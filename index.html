<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>mqlam</title>

    <!-- Instagram icon library -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        /* =========================
           GENERAL PAGE
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;

            background: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================
           MAIN LOGO
        ========================= */

        .scene {
            perspective: 900px;
        }

        .logo {
            position: relative;

            display: inline-block;

            font-size: clamp(80px, 14vw, 220px);
            font-weight: 900;
            letter-spacing: -0.08em;
            line-height: 1;

            color: white;

            -webkit-text-stroke: 5px black;

            transform-style: preserve-3d;

            cursor: pointer;

            transition: transform 0.15s ease-out;

            paint-order: stroke fill;
        }


        /* =========================
           COMIC SPIKED OUTLINE
        ========================= */

        .logo::before {
            content: "";

            position: absolute;

            z-index: -1;

            left: -7%;
            top: -15%;

            width: 114%;
            height: 130%;

            background: black;

            clip-path: polygon(
                0% 38%,
                7% 35%,
                2% 24%,
                13% 27%,
                10% 14%,
                22% 20%,
                20% 7%,
                31% 16%,
                34% 2%,
                42% 14%,
                50% 0%,
                56% 14%,
                67% 4%,
                67% 17%,
                80% 9%,
                77% 22%,
                92% 18%,
                86% 31%,
                100% 30%,
                91% 40%,
                100% 50%,
                91% 57%,
                99% 68%,
                86% 67%,
                91% 81%,
                78% 76%,
                80% 91%,
                67% 83%,
                64% 100%,
                54% 87%,
                45% 98%,
                40% 85%,
                28% 95%,
                30% 81%,
                17% 88%,
                20% 74%,
                6% 77%,
                12% 64%,
                0% 62%,
                9% 51%
            );

            transform: translateZ(-10px);
        }


        /* =========================
           COMIC WHITE OFFSET
        ========================= */

        .logo::after {
            content: "mqlam";

            position: absolute;

            inset: 0;

            color: transparent;

            -webkit-text-stroke: 3px white;

            transform:
                translate(5px, 5px)
                translateZ(-5px);

            z-index: -1;
        }


        /* =========================
           INSTAGRAM BUTTON
        ========================= */

        .instagram-button {
            position: fixed;

            bottom: 35px;
            left: 50%;

            transform: translateX(-50%);

            width: 45px;
            height: 45px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: white;

            color: black;

            border: 2px solid black;
            border-radius: 50%;

            text-decoration: none;

            font-size: 21px;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                color 0.2s ease;

            z-index: 10;
        }


        /* Hover effect */

        .instagram-button:hover {
            transform:
                translateX(-50%)
                scale(1.12);

            background: black;
            color: white;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .logo {
                font-size: 22vw;
            }

            .instagram-button {
                bottom: 25px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================
         CENTER LOGO
    ========================= -->

    <div class="scene">

        <div class="logo" id="logo">
            mqlam
        </div>

    </div>


    <!-- =========================
         INSTAGRAM BUTTON
    ========================= -->

    <a
        href="https://www.instagram.com/YOUR_USERNAME/"
        target="_blank"
        rel="noopener noreferrer"
        class="instagram-button"
        aria-label="Instagram"
    >
        <i class="fa-brands fa-instagram"></i>
    </a>


    <!-- =========================
         3D LOGO HOVER
    ========================= -->

    <script>

        const logo = document.getElementById("logo");


        logo.addEventListener("mousemove", (event) => {

            const rect = logo.getBoundingClientRect();


            const x =
                event.clientX -
                (rect.left + rect.width / 2);

            const y =
                event.clientY -
                (rect.top + rect.height / 2);


            const rotateY =
                (x / rect.width) * 25;

            const rotateX =
                -(y / rect.height) * 25;


            logo.style.transform = `
                rotateX(${rotateX}deg)
                rotateY(${rotateY}deg)
                scale(1.04)
            `;

        });


        logo.addEventListener("mouseleave", () => {

            logo.style.transform = `
                rotateX(0deg)
                rotateY(0deg)
                scale(1)
            `;

        });

    </script>


</body>
</html>
